name: Terraform

on:
  pull_request:
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: terraform/validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@v4 # tag until its commit SHA is resolved (no verified SHA in this project yet)
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', '**/main.tf') }}
          restore-keys: terraform-plugins-${{ runner.os }}-

      - name: fmt, validate every root, terraform test (mock providers), type-check tfvars examples
        run: bash scripts/ci/terraform-validate-all.sh
