name: Terraform

on:
  pull_request:
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: terraform/validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', '**/main.tf') }}
          restore-keys: terraform-plugins-${{ runner.os }}-

      - name: fmt, validate every module/example/stack, type-check tfvars examples
        run: bash scripts/ci/terraform-validate-all.sh
